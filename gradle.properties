# gradle.properties - instructions to point Gradle to a compatible JDK
# By default this file is inert. To force Gradle to use a specific JDK,
# uncomment and set the path below to a JDK installation on your machine.
# Use a JDK <= 23 (Gradle's max supported JVM in your environment) or
# use JDK 17 which the project already targets via toolchains.

# Example (Windows) - adjust to the actual installation path:
# org.gradle.java.home=C:\Program Files\Java\jdk-17

# If you prefer not to edit this file, change the Gradle JVM in your IDE:
# IntelliJ IDEA -> File > Settings > Build, Execution, Deployment > Build Tools > Gradle
# then set 'Gradle JVM' to a compatible JDK (e.g. 17 or 23).

# NOTES:
# - Do NOT point org.gradle.java.home to Java 25.x because Gradle 8.10 in this environment
#   is not compatible with Java 25 and will fail to sync.
# - Keep this file checked into VCS only if you want to share a fixed JDK path with the team.
#   In most cases it's better to configure the IDE or the user's local environment.

# The assistant originally attempted to auto-set this path but the target is not available on this machine.
# Uncomment and set a valid JDK installation path if you have one, or install a JDK (Temurin 17 recommended) and then set it here.
# org.gradle.java.home=C:/Program Files/Eclipse Adoptium/jdk-17.0.17.10-hotspot

# Autoriser Gradle à télécharger automatiquement un JDK compatible si aucun n'est disponible localement
org.gradle.java.installations.auto-download=true
